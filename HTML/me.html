<html>
  <head>
    <meta charset="UTF-8">
    <title>Mesero</title>
    <link rel="stylesheet" href="../CSS/stilo.css">
    <link rel="icon" href="../img/icon.png" type="image/png">
    <script src="../JS/mesero.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Cooperativa Marrana</h1>
    </header>
    <nav class="busqueda">
        <a class="bota" href="index.html"><button class="bot">Menú</button></a>
        <a class="bota" href="co.html"><button class="bot">Cocina</button></a>
        <a class="bota" href="admin.html"><button class="bot">Administrador</button></a>
    </nav>
    <h2 class="subt">Realizar pedido</h2>
    <form id="formPedido">
      <!-- Sección de platos -->
      <p class="orpla">Número de platos a pedir:</p>
      <input class="botm" id="nPlatos" type="number" name="nPlatos" min="1" max="10"/>
      <div id="contenedorPlatos"></div>
      <br>
      <!-- Sección de bebidas -->
      <p class="orpla">Número de bebidas a pedir:</p>
      <input class="botm" id="nBebidas" type="number" name="nBebidas" min="1" max="10"/>
      <div id="contenedorBebidas"></div>
      <br>
      <button class="botm" id="btnCalcular" type="button">Calcular total</button>
    </form>
    <h4 class="total">Total:</h4>
    <p class="precio" id="totalPedido">$0</p>
    <p id="mensajeError" style="color:red; font-family:sans-serif; font-size:20px;"></p>
  </body>
</html>
